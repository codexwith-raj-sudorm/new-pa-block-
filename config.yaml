# Jarvis MVP configuration
assistant:
  name: "Jarvis"
  timezone: "Asia/Kolkata"  # change to your timezone

llm:
  provider: "gemini"  # gemini (live) | anthropic | openai | ollama (later phases)
  model: "gemini-2.0-flash"  # override with GEMINI_MODEL env var
  fallback_model: ""
  max_tokens: 1024
  daily_spend_cap_usd: 2.0  # enforced in a later phase

features:
  phase: 1
  tools_enabled: false  # Phase 2
  memory_enabled: false # Phase 3 (history works now; facts/todos/reminders in P3)

server:
  host: "0.0.0.0"
  port: 8000
