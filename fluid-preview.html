<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>JARVIS — Fluid Theme Preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #05050A;
    color: #F0F0F5;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center;
    overflow: hidden;
  }
  /* ---- 1. FluidAnimatedBackground ---- */
  .stage { position: relative; width: 100%; max-width: 480px; height: 100%; overflow: hidden; }
  .blobs {
    position: absolute; inset: -25%; pointer-events: none;
    background:
      radial-gradient(circle at 25% 25%, rgba(67,24,255,.40) 0%, rgba(67,24,255,0) 40%),
      radial-gradient(circle at 80% 80%, rgba(0,229,255,.30) 0%, rgba(0,229,255,0) 45%);
    animation: spin 20s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .screen { position: relative; height: 100%; display: flex; flex-direction: column; }
  /* ---- header (in-theme chrome for context) ---- */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px 10px;
    background: rgba(255,255,255,.06);
    border-bottom: 1px solid rgba(255,255,255,.10);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  }
  .core {
    width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #00E5FF, #4318FF 70%);
    box-shadow: 0 0 14px rgba(0,229,255,.8), 0 0 34px rgba(67,24,255,.5);
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { box-shadow: 0 0 8px rgba(0,229,255,.5), 0 0 20px rgba(67,24,255,.35); } }
  header .t1 { font-weight: 700; letter-spacing: 3px; font-size: 15px; }
  header .t2 { font-size: 11px; color: #A0A0AB; letter-spacing: 1px; }
  /* ---- 2. AnimatedGlassBubble ---- */
  #chat { flex: 1; overflow-y: auto; padding: 14px 0 6px; display: flex; flex-direction: column; }
  .row { display: flex; padding: 4px 16px; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }
  .bubble {
    max-width: 300px; padding: 16px;
    font-size: 15px; line-height: 22px;
    border: 1px solid rgba(255,255,255,.10);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    animation: enter .45s cubic-bezier(.2,.9,.25,1.12) both;
  }
  .row.user .bubble { background: rgba(67,24,255,.70); border-radius: 20px 20px 4px 20px; }
  .row.bot .bubble { background: rgba(255,255,255,.145); border-radius: 20px 20px 20px 4px; }
  @keyframes enter { from { opacity: 0; transform: translateY(50%); } }
  .dots span { display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 50%;
    background: #A0A0AB; animation: blink 1s infinite; }
  .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 50% { opacity: .2; } }
  /* ---- 3. FluidInputBar ---- */
  .inputbar {
    margin: 8px 16px 18px; padding: 6px 6px 6px 8px;
    display: flex; align-items: center;
    background: rgba(255,255,255,.145);
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 999px;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  }
  .inputbar input {
    flex: 1; border: 0; outline: 0; background: transparent;
    color: #F0F0F5; font-size: 16px; padding: 12px 16px; min-width: 0;
  }
  .inputbar input::placeholder { color: #A0A0AB; }
  #actBtn {
    width: 46px; height: 46px; flex: 0 0 46px; border: 0; cursor: pointer;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.145); color: #A0A0AB;
    transition: transform .25s cubic-bezier(.3,1.4,.4,1), background .25s, color .25s, box-shadow .25s;
  }
  #actBtn.hasttext { background: linear-gradient(135deg, #4318FF, #00E5FF); color: #fff; transform: scale(1.1);
    box-shadow: 0 0 18px rgba(67,24,255,.7); }
  #actBtn.listening { background: linear-gradient(135deg, #FF2A5F, #FF7B00); color: #fff; transform: scale(1.1);
    box-shadow: 0 0 18px rgba(255,42,95,.7); animation: pulse 1.2s ease-in-out infinite; }
  #actBtn svg { width: 22px; height: 22px; }
  .hint { text-align: center; font-size: 11px; color: #A0A0AB; padding: 0 0 12px; letter-spacing: .5px; }
</style>
</head>
<body>
<div class="stage">
  <div class="blobs"></div>
  <div class="screen">
    <header><div class="core"></div><div><div class="t1">JARVIS</div><div class="t2">FLUID THEME · ONLINE</div></div></header>
    <div id="chat"></div>
    <div class="inputbar">
      <input id="box" type="text" placeholder="Message JARVIS..." autocomplete="off">
      <button id="actBtn" aria-label="Action"></button>
    </div>
    <div class="hint">HTML mockup of fluidjarvistheme.kt — type + send, or tap mic</div>
  </div>
</div>
<script>
  const MIC = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm6-3a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.94V22h2v-2.06A8 8 0 0 0 20 12h-2z"/></svg>';
  const SEND = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21.8 12 3.4 3.6l-.01 6.53L14 12 3.39 13.87z"/></svg>';
  const chat = document.getElementById('chat'), box = document.getElementById('box'), btn = document.getElementById('actBtn');
  let listening = false, timer = null;
  btn.innerHTML = MIC;
  function scroll() { chat.scrollTop = chat.scrollHeight; }
  function add(text, who) {
    const r = document.createElement('div'); r.className = 'row ' + who;
    const b = document.createElement('div'); b.className = 'bubble'; b.textContent = text;
    r.appendChild(b); chat.appendChild(r); scroll();
  }
  function typing(on) {
    let t = document.getElementById('typing');
    if (on && !t) {
      t = document.createElement('div'); t.className = 'row bot'; t.id = 'typing';
      t.innerHTML = '<div class="bubble dots"><span></span><span></span><span></span></div>';
      chat.appendChild(t); scroll();
    } else if (!on && t) t.remove();
  }
  const REPLIES = [
    'At once, sir. Scanning now.',
    'Done. Anything else, Master Raj?',
    'Good evening, sir. All systems nominal.',
    'Understood — consider it handled.'
  ];
  let ri = 0;
  function reply() {
    typing(true);
    setTimeout(() => { typing(false); add(REPLIES[ri++ % REPLIES.length], 'bot'); }, 900);
  }
  function refresh() {
    const has = box.value.trim().length > 0;
    btn.classList.toggle('hasttext', has && !listening);
    btn.classList.toggle('listening', listening);
    btn.innerHTML = (has && !listening) ? SEND : MIC;
  }
  function send() {
    const v = box.value.trim();
    if (!v || listening) return;
    add(v, 'user'); box.value = ''; refresh(); reply();
  }
  function mic() {
    if (listening || box.value.trim()) { send(); return; }
    listening = true; refresh();
    box.placeholder = 'Listening...';
    timer = setTimeout(() => {
      listening = false; box.placeholder = 'Message JARVIS...'; refresh();
      add('What time is it', 'user'); reply();
    }, 2500);
  }
  box.addEventListener('input', refresh);
  box.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  btn.addEventListener('click', () => box.value.trim() ? send() : mic());
  // opening beats, staggered like the real app
  setTimeout(() => add('Good evening, Master Raj.', 'bot'), 400);
  setTimeout(() => add('Show me the fluid theme', 'user'), 1100);
  setTimeout(reply, 1900);
</script>
</body>
</html>
