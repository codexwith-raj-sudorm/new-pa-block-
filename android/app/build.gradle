plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.jarvis.app'
    compileSdk 34

    def obfuscatedEnv = { String name ->
        def raw = System.getenv(name) ?: ''
        raw ? java.util.Base64.getEncoder().encodeToString(raw.reverse().bytes) : ''
    }
    def base64Env = { String name ->
        def raw = System.getenv(name) ?: ''
        raw ? java.util.Base64.getEncoder().encodeToString(raw.bytes) : ''
    }
    def quoted = { String value -> "\"${value}\"" }

    defaultConfig {
        applicationId 'com.jarvis.app'
        minSdk 26
        targetSdk 34
        versionCode 72
        versionName '6.21'
        // Public-safe defaults. Optional owner secrets are injected only into
        // debug/private builds below; release builds intentionally stay empty.
        buildConfigField 'String', 'DEFAULT_GEMINI_KEY', quoted('')
        buildConfigField 'String', 'DEFAULT_MASTER', quoted('')
        buildConfigField 'String', 'DEFAULT_MASTER_KEY', quoted('')
        buildConfigField 'String', 'DEFAULT_GITHUB_TOKEN', quoted('')
    }

    signingConfigs {
        release {
            storeFile file('keystore.p12')
            storePassword System.getenv('KEYSTORE_PASS')
            keyAlias System.getenv('KEY_ALIAS') ?: 'jarvis'
            keyPassword System.getenv('KEY_PASS')
            storeType 'PKCS12'
        }
    }

    buildTypes {
        debug {
            // Private/dev convenience only. Never relied upon by public release APKs.
            buildConfigField 'String', 'DEFAULT_GEMINI_KEY', quoted(obfuscatedEnv('GEMINI_API_KEY'))
            buildConfigField 'String', 'DEFAULT_MASTER', quoted(base64Env('MASTER_IDENTITY'))
            buildConfigField 'String', 'DEFAULT_MASTER_KEY', quoted(obfuscatedEnv('MASTER_KEY'))
            buildConfigField 'String', 'DEFAULT_GITHUB_TOKEN', quoted(obfuscatedEnv('GH_READ_TOKEN'))
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Explicitly keep public/release artifacts free of built-in owner secrets.
            buildConfigField 'String', 'DEFAULT_GEMINI_KEY', quoted('')
            buildConfigField 'String', 'DEFAULT_MASTER', quoted('')
            buildConfigField 'String', 'DEFAULT_MASTER_KEY', quoted('')
            buildConfigField 'String', 'DEFAULT_GITHUB_TOKEN', quoted('')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.09.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.savedstate:savedstate:1.2.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.security:security-crypto:1.0.0'
    kapt 'androidx.room:room-compiler:2.6.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303' // real org.json for JVM unit tests
}

tasks.withType(Test) {
    testLogging {
        showStandardStreams = true
    }
}
