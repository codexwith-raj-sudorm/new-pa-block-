# Builds + tests the Android app and uploads the installable APK.
# Phone: Actions tab → latest run → Artifacts → jarvis-apk → install.
name: android
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
      - run: gradle clean :app:testDebugUnitTest --console=plain > ../build-output.log 2>&1
      - name: Diagnose failures
        if: failure()
        run: |
          grep -E "^e: " ../build-output.log | head -20 | while IFS= read -r line; do echo "::error ::COMPILE::$line"; done || true
          grep -A4 " FAILED$" ../build-output.log | head -40 | while IFS= read -r line; do echo "::error ::TEST::$line"; done || true
          grep -i "error:" ../build-output.log | grep -v "0 errors" | head -20 | while IFS= read -r line; do echo "::error ::KAPT::$line"; done || true
          grep -B2 -A8 "FAILED$" ../build-output.log | head -60 | while IFS= read -r line; do echo "::error ::CTX::$line"; done || true
          for f in app/build/test-results/testDebugUnitTest/*.xml; do [ -e "$f" ] || continue; grep -o 'message="[^"]*"' "$f" | head -5 | while IFS= read -r m; do echo "::error ::XML::$m"; done; done || true
          grep -o "ACTUAL_IS\[[^]]*\]" ../build-output.log | head -3 | while IFS= read -r line; do echo "::error ::REVEAL::$line"; done || true
          grep -o "CODES\[[^]]*\]" ../build-output.log | head -3 | while IFS= read -r line; do echo "::error ::REVEAL::$line"; done || true
          grep -B1 -A3 "AssertionError\|ComparisonFailure" ../build-output.log | head -20 | while IFS= read -r line; do echo "::error ::ASSERT::$line"; done || true
          find app/build -name "*ToolsTest*.xml" 2>/dev/null | head -5 | while IFS= read -r f; do echo "::error ::FOUND::$f"; grep -o 'message="[^"]*"' "$f" | head -4 | while IFS= read -r m; do echo "::error ::FAILMSG::$m"; done; done || true
          grep "DIAG " ../build-output.log | head -10 | while IFS= read -r line; do echo "::error ::DIAG::$line"; done || true
      - name: Decode keystore (stable signing when configured)
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then echo "$ANDROID_KEYSTORE_B64" | base64 -d > app/keystore.p12; fi
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      - name: Assemble (signed release when keystore exists)
        run: |
          if [ -f app/keystore.p12 ]; then gradle :app:assembleRelease; cp app/build/outputs/apk/release/app-release.apk ../jarvis.apk; else gradle :app:assembleDebug; cp app/build/outputs/apk/debug/app-debug.apk ../jarvis.apk; fi
      - uses: actions/upload-artifact@v7
        with:
          name: jarvis-apk
          path: jarvis.apk
