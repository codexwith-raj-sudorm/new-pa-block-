plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.jarvis.app'
    compileSdk 34

    def localSecretProps = new Properties()
    [rootProject.file('local.properties'), file('../../local.properties')].each { f ->
        if (f.exists()) {
            f.withInputStream { localSecretProps.load(it) }
        }
    }
    def secretValue = { String name ->
        def raw = (localSecretProps.getProperty(name) ?: System.getenv(name) ?: '').trim()
        if ((raw.startsWith('"') && raw.endsWith('"')) || (raw.startsWith("'") && raw.endsWith("'"))) {
            raw = raw.substring(1, raw.length() - 1)
        }
        raw
    }
    def buildString = { String value ->
        '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }
    def base64 = { String value ->
        value ? java.util.Base64.getEncoder().encodeToString(value.bytes) : ''
    }

    defaultConfig {
        applicationId 'com.jarvis.app'
        minSdk 26
        targetSdk 34
        versionCode 72
        versionName '6.21'
        // Personal/private build defaults. Secrets come from untracked
        // local.properties (or CI env fallback) and are intentionally usable in
        // both debug and release APKs for zero-setup installs on owned devices.
        buildConfigField 'String', 'DEFAULT_GEMINI_KEY', buildString(secretValue('GEMINI_API_KEY'))
        buildConfigField 'String', 'DEFAULT_MASTER', buildString(base64(secretValue('MASTER_IDENTITY')))
        buildConfigField 'String', 'DEFAULT_MASTER_KEY', buildString(secretValue('MASTER_KEY'))
        buildConfigField 'String', 'DEFAULT_GITHUB_TOKEN', buildString(secretValue('GH_READ_TOKEN'))
    }

    signingConfigs {
        release {
            storeFile file('keystore.p12')
            storePassword System.getenv('KEYSTORE_PASS')
            keyAlias System.getenv('KEY_ALIAS') ?: 'jarvis'
            keyPassword System.getenv('KEY_PASS')
            storeType 'PKCS12'
        }
    }

    buildTypes {
        debug {
            // Personal dev build: keep symbols and line numbers for Logcat.
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.release
            // Private release: faster builds + readable crash stacks. This APK is
            // for owned devices, not hostile distribution.
            minifyEnabled false
            shrinkResources false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.09.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    def cameraX = '1.3.4'
    implementation "androidx.camera:camera-camera2:${cameraX}"
    implementation "androidx.camera:camera-lifecycle:${cameraX}"
    implementation "androidx.camera:camera-view:${cameraX}"
    implementation 'com.google.mediapipe:tasks-vision:0.10.32'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.savedstate:savedstate:1.2.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.security:security-crypto:1.0.0'
    kapt 'androidx.room:room-compiler:2.6.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303' // real org.json for JVM unit tests
}

tasks.withType(Test) {
    testLogging {
        showStandardStreams = true
    }
}
