<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Jarvis</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #141b33;
    --accent: #38bdf8;
    --text: #e6ecf5;
    --muted: #8b94a7;
    --bubble-user: #1d5fd6;
    --bubble-bot: #1b2340;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    max-width: 640px;
    margin: 0 auto;
  }
  header {
    padding: 14px 16px;
    background: var(--panel);
    border-bottom: 1px solid #24304f;
    display: flex;
    align-items: center;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: 2px; }
  header small { color: var(--muted); margin-left: auto; font-size: 12px; }
  #status { color: var(--muted); font-size: 12px; padding: 6px 16px 0; }
  #status.ok { color: #4ade80; }
  #status.warn { color: #fbbf24; }
  #status.err { color: #f87171; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    max-width: 85%;
    padding: 12px 14px;
    border-radius: 16px;
    font-size: 16px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user { align-self: flex-end; background: var(--bubble-user); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bubble-bot); border-bottom-left-radius: 4px; }
  .msg.typing { color: var(--muted); font-style: italic; }
  form {
    display: flex;
    gap: 8px;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
    background: var(--panel);
    border-top: 1px solid #24304f;
    position: sticky;
    bottom: 0;
  }
  input[type="text"] {
    flex: 1;
    font-size: 16px;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #2b3555;
    background: #0e1430;
    color: var(--text);
    outline: none;
    min-width: 0;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    font-size: 16px;
    padding: 0 20px;
    min-height: 52px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: #04222f;
    font-weight: 700;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <header>
    <div class="dot"></div>
    <h1>JARVIS</h1>
    <small>MVP · Phase 1</small>
  </header>
  <div id="status">connecting…</div>
  <div id="chat"></div>
  <form id="composer">
    <input id="input" type="text" placeholder="Ask Jarvis anything…" autocomplete="off" enterkeyhint="send" />
    <button id="send" type="submit">Send</button>
  </form>

<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('composer');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const statusEl = document.getElementById('status');
  let cid = null;

  function addMsg(text, who) {
    const div = document.createElement('div');
    div.className = 'msg ' + who;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  fetch('/health')
    .then(r => r.json())
    .then(d => {
      if (d.brain === 'connected') {
        statusEl.textContent = '● online · ' + d.provider + ' · v' + d.version;
        statusEl.className = 'ok';
      } else {
        statusEl.textContent = '● online · brain not connected (API key needed)';
        statusEl.className = 'warn';
      }
    })
    .catch(() => {
      statusEl.textContent = '● offline — server unreachable';
      statusEl.className = 'err';
    });

  addMsg('Hello. I am Jarvis. My brain socket is wired — I just need an API key to wake up. Ask me anything and I\'ll tell you how.', 'bot');

  function sendStream(text, botDiv) {
    return new Promise((resolve) => {
      const url = '/api/chat/stream?message=' + encodeURIComponent(text)
        + (cid ? '&conversation_id=' + encodeURIComponent(cid) : '');
      const es = new EventSource(url);
      let full = '';
      let started = false;
      es.onmessage = (ev) => {
        let d;
        try { d = JSON.parse(ev.data); } catch { return; }
        if (d.type === 'chunk') {
          if (!started) { botDiv.classList.remove('typing'); botDiv.textContent = ''; started = true; }
          full += d.text;
          botDiv.textContent = full;
          chat.scrollTop = chat.scrollHeight;
        } else if (d.type === 'done') {
          cid = d.conversation_id;
          es.close();
          resolve(true);
        } else if (d.type === 'error') {
          botDiv.classList.remove('typing');
          botDiv.textContent = d.message;
          chat.scrollTop = chat.scrollHeight;
          es.close();
          resolve(true);
        }
      };
      es.onerror = () => { es.close(); resolve(false); };
    });
  }

  async function sendFallback(text, botDiv) {
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, conversation_id: cid })
      });
      const data = await res.json();
      cid = data.conversation_id || cid;
      botDiv.classList.remove('typing');
      botDiv.textContent = data.reply || '(empty reply)';
    } catch {
      botDiv.classList.remove('typing');
      botDiv.textContent = 'Error reaching the server. Is it still running?';
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    addMsg(text, 'user');
    sendBtn.disabled = true;
    const botDiv = addMsg('Jarvis is thinking…', 'bot typing');
    try {
      const ok = await sendStream(text, botDiv);
      if (!ok) await sendFallback(text, botDiv);
    } catch {
      await sendFallback(text, botDiv);
    } finally {
      sendBtn.disabled = false;
      chat.scrollTop = chat.scrollHeight;
      input.focus();
    }
  });
</script>
</body>
</html>
