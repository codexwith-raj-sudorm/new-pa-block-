# Render Blueprint — one-click deploy for Jarvis MVP.
# Dashboard → New → Blueprint → pick this repo → set GEMINI_API_KEY → Deploy.
services:
  - type: web
    name: jarvis-mvp
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: chainlit run app.py --host 0.0.0.0 --port $PORT --headless
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_API_KEY
        sync: false # entered in the Render dashboard, never in git
