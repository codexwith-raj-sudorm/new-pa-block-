plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.jarvis.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jarvis.app'
        minSdk 26
        targetSdk 34
        versionCode 24
        versionName '3.3'
        // Built-in default key from CI secret (empty when the secret is unset).
        // Lightly obfuscated (reversed Base64) so the plain key isn't greppable in the APK.
        def _rawKey = System.getenv('GEMINI_API_KEY') ?: ''
        def _obfKey = _rawKey ? java.util.Base64.getEncoder().encodeToString(_rawKey.reverse().bytes) : ''
        buildConfigField 'String', 'DEFAULT_GEMINI_KEY', "\"${_obfKey}\""
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.09.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.savedstate:savedstate:1.2.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303' // real org.json for JVM unit tests
}

tasks.withType(Test) {
    testLogging {
        showStandardStreams = true
    }
}
