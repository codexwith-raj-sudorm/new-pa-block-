# Manual-only: verifies the CI Gemini secret used by private/dev builds is set
# and responding. Release APKs keep built-in key fields empty. Prints only HTTP status.
name: keycheck
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning ::GEMINI_API_KEY secret is unset - private/dev builds will have no convenience key."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 \
            "https://generativelanguage.googleapis.com/v1beta/models?pageSize=1&key=$GEMINI_API_KEY")
          echo "gemini_models_http=$code"
          if [ "$code" = "200" ]; then
            echo "Gemini API key is set and responding (HTTP 200)."
          else
            echo "::error ::Gemini key check failed (HTTP $code). 400/401 = bad key, 429 = quota spent."
            exit 1
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
